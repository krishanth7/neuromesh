[package]
name = "neuromesh-network"
description = "Authenticated bounded QUIC transport for NeuroMesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[lints]
workspace = true
[dependencies]
neuromesh-core = { path = "../neuromesh-core" }
neuromesh-protocol = { path = "../neuromesh-protocol" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
ed25519-dalek = "3"
[dev-dependencies]
rcgen = "0.13"
